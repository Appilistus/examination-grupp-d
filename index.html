<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- login -->


  <!-- dashboard -->
  <header>
    <h2>Välkommen</h2>
    <img class="hero-image"src="/assets/gym.jpg" alt="Gym" class="gym-image">
  </header>

  <section class="getStarted">
    <h2>Kom igång</h2>
    <div class="getStarted-cards">
      <img class="card-image"src="/assets/lifting.jpg" alt="Weightlifting" class="getStarted-card">
      <h3>Tips för dig som vill komma igång med träningen</h3>
    </div>
    <div class="getStarted-cards">
      <img class="card-image" src="/assets/runners.jpg" alt="Running" class="getStarted-card">
      <h3>Ny på gymmet? Kom igång på 1-2-3!</h3>
    </div>
    <div class="getStarted-cards">
      <img class="card-image"src="/assets/app.jpg" alt="Mobile App" class="getStarted-card">
      <h3>Appen är din träningsassistent i fickan</h3>
    </div>
    <div class="getStarted-cards">
      <img class="card-image"src="/assets/maps.jpg" alt="Running" class="getStarted-card">
      <h3>Hitta ditt närmaste gym</h3>
    </div>
  </section>

  <section>
    <h2>Bjuda in vänner</h2>
    <img class="invite-image" src="/assets/friends.jpg" alt="Invite Friends" class="invite-image">
  </section>

  <section>
    <h2>Blog</h2>
    <img class="blog-image" src="/assets/running.jpg" alt="Blog" class="blog-image">
  </section>

  <!-- profil -->
</body>
</html>
